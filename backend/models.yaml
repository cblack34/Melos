# Selectable models for the generation/meta AI calls, and the per-model quirks
# that let this file (not code) capture what a model needs. Adding, removing,
# or retuning a model is usually just editing this file — see docs/tech-stack.md
# for what each field does and why. A model omitted from here still works via
# the code-based defaults in generation/llm.py; this file is additive.

providers:
  # Omit base_url so MELOS_OLLAMA_BASE_URL / LlmSettings.ollama_base_url win
  # (compose sets host.docker.internal; a YAML localhost would shadow it and
  # break generation inside the backend container). Set base_url only when
  # intentionally pointing at a non-default Ollama host.
  ollama:
    kind: ollama
  openrouter:
    kind: openrouter

models:
  generation:
    - id: qwen3.6:27b
      label: Qwen 3.6 27B (local)
      provider: ollama
      reasoning: none
    - id: anthropic/claude-opus-5
      label: Claude Opus 5 — best quality ($5/$25)
      provider: openrouter
    - id: anthropic/claude-sonnet-5
      label: Claude Sonnet 5 — balanced ($2/$10)
      provider: openrouter
    - id: x-ai/grok-4.5
      label: Grok 4.5 — strong structured output ($2/$6)
      provider: openrouter
    - id: anthropic/claude-haiku-4.5
      label: Claude Haiku 4.5 — fast & cheap ($1/$5)
      provider: openrouter
    - id: deepseek/deepseek-v4-pro
      label: DeepSeek V4 Pro — cheap, strong reasoning ($0.435/$0.87)
      provider: openrouter
      reasoning: none
    - id: deepseek/deepseek-v4-flash
      label: DeepSeek V4 Flash — cheapest ($0.09/$0.18)
      provider: openrouter
      reasoning: none

  meta:
    - id: qwen3.5:9b
      label: Qwen 3.5 9B (local)
      provider: ollama
      reasoning: none
    - id: openai/gpt-5-nano
      label: GPT-5 nano — ultra cheap ($0.05/$0.40)
      provider: openrouter
    - id: deepseek/deepseek-v4-flash
      label: DeepSeek V4 Flash — cheap, solid ($0.09/$0.18)
      provider: openrouter
      reasoning: none
    - id: deepseek/deepseek-v4-pro
      label: DeepSeek V4 Pro — stronger reasoning ($0.435/$0.87)
      provider: openrouter
      reasoning: none
